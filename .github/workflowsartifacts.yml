name: Executing multiple jobs
on: [push]
jobs:
  artifacts:
    env:
      ARTIFACTS_NAME: 'Artifactory'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Build ${{env.ARTIFACTS_NAME}} for ubuntu-latest
        run: go build ${{env.ARTIFACTS_NAME}}.go
      - name: Upload artifactory for linux
        uses: actions/upload-artifact@v1.0.0
        with:
          name: linux
          path: ./${{env.ARTIFACTS_NAME}}
